            display: inline-block;
            width: 40px;
            height: 20px;

        .switch input {

            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 20px;
            border: 1px solid #555;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #ff0055;
            box-shadow: 0 0 10px #ff0055;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 650px) {

        .section-label {

            color: #00e5ff;
            margin-bottom: 5px;
            display: block;

        }

            padding: 10px;

            border: 1px solid #ff0055;

            border-radius: 8px;

            padding-right: 5px;
        }

        .bio-item {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ff0055;
            padding: 10px;
            border-radius: 6px;

            justify-content: space-between;

        .bio-text {

            color: #00ffcc;

        .btn-mini-copy {
            background: #ff0055;

            font-size: 11px;

            padding-top: 15px;
            border-top: 1px solid rgba(0, 229, 255, 0.2);

            justify-content: center;

            flex-wrap: wrap;

            0% { border-color: #ff0055; box-shadow: 0 0 20px #ff0055; }

        // সব হেডার ও লেবেল টেক্সট সেট করা
        document.getElementById('mainHeaderLogo').innerText = customTitleText;
        document.getElementById('newTitleInput').value = customTitleText;

        document.getElementById('lbl1').innerText = customLbl1;
        document.getElementById('label1Input').value = customLbl1;

        document.getElementById('lbl2').innerText = customLbl2;
        document.getElementById('label2Input').value = customLbl2;

        document.getElementById('lbl3').innerText = customLbl3;
        document.getElementById('label3Input').value = customLbl3;

        const modeToggle = document.getElementById('modeToggle');
        const glowToggle = document.getElementById('glowToggle');
        const btnEnglishTab = document.getElementById('btnEnglishTab');
        const btnBanglaTab = document.getElementById('btnBanglaTab');

        if (modeToggle) {
            modeToggle.addEventListener('change', function() {
                const genSection = document.getElementById('generatorSection');
                const biosSection = document.getElementById('readyBiosSection');

                if (this.checked) {
                    if (genSection) genSection.style.display = 'none';
                    if (biosSection) biosSection.style.display = 'block';
                    document.body.classList.add('dark-attitude-mode');
                    renderBioList();
                } else {
                    if (genSection) genSection.style.display = 'grid';
                    if (biosSection) biosSection.style.display = 'none';
                    document.body.classList.remove('dark-attitude-mode');
                }
            });
        }

        if (glowToggle) {
            glowToggle.addEventListener('change', function() {
                const statusText = document.getElementById('switchStatusText');
                const card = document.getElementById('mainCard');
                if (this.checked) {
                    if (statusText) statusText.innerText = "RGB ON";
                    if (card) card.classList.add('rgb-active-card');
                } else {
                    if (statusText) statusText.innerText = "RGB OFF";
                    if (card) card.classList.remove('rgb-active-card');
                }
            });
        }

        if (btnEnglishTab) {
            btnEnglishTab.addEventListener('click', function() {
                currentTab = 'english';
                this.classList.add('active');
                if (btnBanglaTab) btnBanglaTab.classList.remove('active');
                renderBioList();
            });
        }

        if (btnBanglaTab) {
            btnBanglaTab.addEventListener('click', function() {
                currentTab = 'bangla';
                this.classList.add('active');
                if (btnEnglishTab) btnEnglishTab.classList.remove('active');
                renderBioList();
            });
        }
    });

    // অ্যাডমিন প্যানেল ওপেন করার ফাংশন
    function openAdminPanel() {
        let pass = prompt("অ্যাডমিন পাসওয়ার্ড দিন:");
        if (pass === "1") {
            document.getElementById('adminModal').style.display = 'flex';
        } else if (pass !== null) {
            alert("ভুল পাসওয়ার্ড!");
        }
    }

    function closeAdminPanel() {
        document.getElementById('adminModal').style.display = 'none';
    }

    // অ্যাডমিন প্যানেল থেকে সমস্ত টেক্সট সেভ করার ফাংশন
    function saveAdminChanges() {
        customTitleText = document.getElementById('newTitleInput').value.trim() || customTitleText;
        localStorage.setItem('custom_title', customTitleText);
        document.getElementById('mainHeaderLogo').innerText = customTitleText;

        customLbl1 = document.getElementById('label1Input').value.trim() || customLbl1;
        localStorage.setItem('custom_lbl1', customLbl1);
        document.getElementById('lbl1').innerText = customLbl1;

        customLbl2 = document.getElementById('label2Input').value.trim() || customLbl2;
        localStorage.setItem('custom_lbl2', customLbl2);
        document.getElementById('lbl2').innerText = customLbl2;

        customLbl3 = document.getElementById('label3Input').value.trim() || customLbl3;
        localStorage.setItem('custom_lbl3', customLbl3);
        document.getElementById('lbl3').innerText = customLbl3;

        let newBiosText = document.getElementById('newBioInput').value.trim();
        if (newBiosText) {
            let lines = newBiosText.split('\n');
            lines.forEach(line => {
                if(line.trim() !== "") {
                    banglaSadDialogues.unshift(line.trim());
                }
            });
            localStorage.setItem('custom_bios', JSON.stringify(banglaSadDialogues));
            document.getElementById('newBioInput').value = '';
            renderBioList();
        }

        alert('সফলভাবে সমস্ত লেখা আপডেট হয়েছে!');
        closeAdminPanel();
    }

    function renderBioList() {
        const container = document.getElementById('bioListContainer');
        if (!container) return;
        container.innerHTML = '';

        const listToRender = (currentTab === 'bangla') ? banglaSadDialogues : englishBios;

        listToRender.forEach(text => {
            const item = document.createElement('div');
            item.className = 'bio-item';
            item.innerHTML = `
                <span class="bio-text">${text}</span>
                <button class="btn-mini-copy" onclick="copyDirect('${text.replace(/'/g, "\\'")}')">কপি</button>
            `;
            container.appendChild(item);
        });
    }

    function copyDirect(text) {
        navigator.clipboard.writeText(text);
        alert('কপি হয়েছে!');
    }

    function updateUI(hex) {
        selectedColorHex = hex.toUpperCase();
        document.getElementById('largePreview').style.backgroundColor = selectedColorHex;
        document.getElementById('nativePicker').value = selectedColorHex;
        let r = parseInt(selectedColorHex.slice(1, 3), 16) || 0;
        let g = parseInt(selectedColorHex.slice(3, 5), 16) || 0;
        let b = parseInt(selectedColorHex.slice(5, 7), 16) || 0;
        document.getElementById('redRange').value = r;
        document.getElementById('greenRange').value = g;
        document.getElementById('blueRange').value = b;
    }

    function setColorHex(hex) { updateUI(hex); }
    function updateFromNative(hex) { updateUI(hex); }

    function updateFromSliders() {
        let r = parseInt(document.getElementById('redRange').value).toString(16).padStart(2, '0');
        let g = parseInt(document.getElementById('greenRange').value).toString(16).padStart(2, '0');
        let b = parseInt(document.getElementById('blueRange').value).toString(16).padStart(2, '0');
        let hex = `#${r}${g}${b}`;
        selectedColorHex = hex.toUpperCase();
        document.getElementById('largePreview').style.backgroundColor = selectedColorHex;
        document.getElementById('nativePicker').value = selectedColorHex;
    }

    function addText() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;
        const cleanHex = selectedColorHex.replace('#', '');
        generatedCode += `[${cleanHex}]${text}`;
        document.getElementById('codeArea').innerText = generatedCode;
        document.getElementById('charCount').innerText = generatedCode.length;
        
        const span = document.createElement('span');
        span.style.color = selectedColorHex;
        span.innerText = text + ' ';
        document.getElementById('previewArea').appendChild(span);

        input.value = '';
    }

    function copyCode() { if (!generatedCode) return; navigator.clipboard.writeText(generatedCode); alert('কোড কপি হয়েছে!'); }
    function resetAll() { generatedCode = ''; document.getElementById('codeArea').innerText = ''; document.getElementById('previewArea').innerHTML = ''; document.getElementById('charCount').innerText = '0'; document.getElementById('userInput').value = ''; }
</script>

</body>
