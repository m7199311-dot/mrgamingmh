<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুভ জন্মদিন মামা!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #ffeb3b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        p {
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 30px;
            white-space: pre-wrap;
        }
        .footer-note {
            font-size: 1rem;
            color: #f1f1f1;
            font-style: italic;
            margin-bottom: 20px;
        }
        /* এডিটিং সেকশন */
        .admin-section {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            text-align: left;
        }
        .admin-section textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
            font-size: 1rem;
            resize: vertical;
            color: #333;
        }
        .admin-section button {
            background: #ffeb3b;
            color: #333;
            border: none;
            padding: 8px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .admin-section button:hover {
            background: #fbc02d;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="display-title">শুভ জন্মদিন, মামা! 🎉</h1>
        <p id="display-message">আপনার আজকের দিনটি এবং আগামী দিনগুলো অনেক আনন্দময়, সুস্থতা ও সাফল্যে ভরে উঠুক—এই দোয়াই করি। আমার জীবনের অন্যতম সেরা একজন অভিভাবক ও বন্ধু হওয়ার জন্য আপনাকে অনেক ধন্যবাদ।</p>
        <div class="footer-note" id="display-footer">আপনার স্নেহের ভাগ্নে</div>

        <!-- লেখা পরিবর্তনের অপশন (যা আপনি সাইটে দেখতে পাবেন) -->
        <div class="admin-section">
            <label style="font-size: 0.85rem; display: block; margin-bottom: 5px;">এখানে মেসেজ পরিবর্তন করে আপডেট করুন:</label>
            <textarea id="input-message" placeholder="আপনার মামার জন্য নতুন মেসেজ লিখুন..."></textarea>
            <button onclick="updateMessage()">আপডেট করুন</button>
        </div>
    </div>

    <script>
        // পেজ লোড হওয়ার সময় লোকালস্টোরেজ থেকে ডাটা চেক করা
        window.onload = function() {
            const savedMsg = localStorage.getItem('mamaBirthdayMsg');
            if(savedMsg) {
                document.getElementById('display-message').innerText = savedMsg;
            }
        }

        // আপডেট বাটনে ক্লিক করলে লেখা পরিবর্তন ও সেভ হওয়ার ফাংশন
        function updateMessage() {
            const newMsg = document.getElementById('input-message').value;
            if(newMsg.trim() !== "") {
                document.getElementById('display-message').innerText = newMsg;
                localStorage.setItem('mamaBirthdayMsg', newMsg);
                alert('সফলভাবে আপডেট করা হয়েছে!');
            } else {
                alert('দয়া করে কিছু একটা লিখুন।');
            }
        }
    </script>

</body>
</html>
